<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obito — The Broken Hero</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 18px 10px;
            background: #181818;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 7px 0 0;
            color: #aaa;
            font-size: 14px;
        }

        .pdf-container {
            width: 100%;
            height: calc(100vh - 90px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Obito — The Broken Hero</h1>
        <p>একটি অসম্পূর্ণ কাহিনি ❤️‍🩹</p>
    </header>

    <div class="pdf-container">
        <iframe src="obito.pdf"></iframe>
    </div>

</body>
</html>
